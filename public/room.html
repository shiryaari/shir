<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>חדר הוובינר</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="room" id="room" hidden>
  <div>
    <div class="room-title"><span class="live">שידור חי</span><b id="title"></b><span class="room-viewers badge" id="roomViewers" hidden></span></div>
    <div class="stage" id="stage">
      <div class="cover" id="cover">
        <div id="coverText">הוובינר מתחיל בעוד</div>
        <div class="count" id="count">--:--</div>
        <button id="enter" hidden>כניסה לוובינר ▶</button>
      </div>
    </div>
    <div class="cta" id="cta">
      <div id="ctaTitle"></div>
      <div id="ctaDesc" class="muted" style="margin:4px 0 12px"></div>
      <button id="ctaBtn"></button>
      <div class="cta-activity" role="status"><span id="ctaActivity" hidden></span></div>
    </div>
  </div>
  <div class="chat" id="chat">
    <div class="chat-head">צ'אט <span id="replayLabel" class="small"></span></div>
    <div class="msgs" id="msgs"></div>
    <form id="form"><input id="text" placeholder="כתבי הודעה..." autocomplete="off"><button>שליחה</button></form>
  </div>
</div>
<div class="wrap" id="bad" hidden><div class="card"><h1>הקישור לא תקין</h1><p class="muted">נסי להיכנס מהקישור שקיבלת במייל או בוואטסאפ.</p></div></div>
<div class="modal" id="modal"><div class="modal-box"><header><b>שאלון</b><button id="close" aria-label="סגירה">×</button></header><iframe id="qframe" title="שאלון"></iframe></div></div>
<script src="https://player.vimeo.com/api/player.js"></script>
<script src="/room.js"></script>
</body>
</html>
