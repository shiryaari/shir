<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>חדר הוובינר</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="room webinar-room" id="room" hidden>
  <header class="room-title">
    <b id="title"></b>
    <div class="room-status"><span class="live" id="liveBadge" hidden>שידור חי</span><span class="room-viewers" id="roomViewers" hidden></span></div>
  </header>
  <main class="room-main">
    <div class="stage" id="stage">
      <div class="stage-activity" id="stageActivity" role="status" aria-atomic="false"></div>
      <div class="stage-message" id="stageMessage" aria-hidden="true" hidden>
        <span class="stage-message-initial" id="stageMessageInitial"></span>
        <div class="stage-message-copy">
          <b id="stageMessageName"></b>
          <span id="stageMessageText"></span>
        </div>
      </div>
      <div class="cover room-lobby" id="cover">
        <div class="room-lobby-content">
          <p class="room-lobby-host">שיר יערי</p>
          <div id="coverText">הוובינר מתחיל בעוד</div>
          <div class="count" id="count">--:--</div>
        </div>
      </div>
    </div>
    <div class="cta" id="cta">
      <button class="cta-dismiss" id="ctaDismiss" type="button" aria-label="סגירת ההצעה" hidden>×</button>
      <div id="ctaTitle"></div>
      <div id="ctaDesc" class="muted" style="margin:4px 0 12px"></div>
      <button id="ctaBtn"></button>
    </div>
  </main>
  <aside class="chat" id="chat" aria-label="צ׳אט השידור">
    <div class="chat-head">צ'אט <span id="replayLabel" class="small"></span></div>
    <div class="msgs" id="msgs"></div>
    <form id="form"><input id="text" placeholder="כתבי הודעה..." autocomplete="off"><button>שליחה</button></form>
  </aside>
</div>
<div class="wrap" id="bad" hidden><div class="card"><h1>הקישור לא תקין</h1><p class="muted">נסי להיכנס מהקישור שקיבלת במייל או בוואטסאפ.</p></div></div>
<div class="modal" id="modal"><div class="modal-box"><header><b>שאלון</b><button id="close" aria-label="סגירה">×</button></header><iframe id="qframe" title="שאלון"></iframe></div></div>
<script src="https://player.vimeo.com/api/player.js"></script>
<script src="/room.js"></script>
</body>
</html>
