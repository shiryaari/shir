<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>חדר הוובינר</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="room" id="room" hidden>
  <div>
    <div style="margin-bottom:8px"><span class="badge" id="badge"></span> <b id="title"></b></div>
    <div class="stage" id="stage">
      <div class="cover" id="cover">
        <div id="coverText">הוובינר מתחיל בעוד</div>
        <div class="count" id="count">--:--</div>
        <button id="enter" hidden>כניסה לוובינר ▶</button>
      </div>
    </div>
    <div class="cta" id="cta">
      <div id="ctaTitle" style="font-weight:800;font-size:1.05rem"></div>
      <div id="ctaDesc" class="muted" style="margin:4px 0 10px;color:var(--muted)"></div>
      <button id="ctaBtn"></button>
    </div>
  </div>
  <div class="chat" id="chat">
    <div class="chat-head">צ'אט <span id="replayLabel" class="small" style="font-weight:400"></span></div>
    <div class="msgs" id="msgs"></div>
    <form id="form"><input id="text" placeholder="כתבי הודעה..." autocomplete="off"><button>שליחה</button></form>
  </div>
</div>
<div class="wrap" id="bad" hidden><div class="card"><h1>הקישור לא תקין</h1><p class="muted">נסי להיכנס מהקישור שקיבלת במייל או בוואטסאפ.</p></div></div>
<div class="modal" id="modal"><div class="modal-box"><header><b>שאלון</b><button id="close" aria-label="סגירה">×</button></header><iframe id="qframe" title="שאלון"></iframe></div></div>
<script src="https://player.vimeo.com/api/player.js"></script>
<script src="/room.js"></script>
</body>
</html>
